<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ '/logos/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <div class="container nav__inner">
      <a class="nav__brand" href="#top" aria-label="{{ site.short_title }} home">
        {% include logo.html name="cl4sm-mark" class="nav__mark" width="34" height="34" %}
        {% include logo.html name="cl4sm-wordmark" class="nav__wordmark" width="70" height="26" %}
      </a>
      <input type="checkbox" id="nav-toggle" class="nav__toggle" aria-label="Toggle navigation">
      <label for="nav-toggle" class="nav__burger" aria-hidden="true"><span></span></label>
      <nav class="nav__links">
        <a href="#about">About</a>
        <a href="#topics">Topics</a>
        <a href="#call">Call for Contributions</a>
        <a href="#dates">Dates</a>
        <a href="#schedule">Schedule</a>
        <a href="#speakers">Speakers</a>
        <a href="#organizers">Organisers</a>
      </nav>
    </div>
  </header>

  <main id="top">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    // Close the mobile menu after picking a section.
    document.querySelectorAll('.nav__links a').forEach(function (a) {
      a.addEventListener('click', function () { document.getElementById('nav-toggle').checked = false; });
    });

    // Timeline progress: fill passed dates and grow the line up to today.
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll('.timeline__item'));
      if (!items.length) return;
      var DAY = 864e5, now = Date.now();
      // A date counts as passed once its day is over.
      var t = items.map(function (li) { return li.dataset.date ? Date.parse(li.dataset.date) + DAY : NaN; });
      // Undated entries sit halfway between their dated neighbours.
      t = t.map(function (v, i) {
        if (!isNaN(v)) return v;
        var a = i, b = i;
        while (a >= 0 && isNaN(t[a])) a--;
        while (b < t.length && isNaN(t[b])) b++;
        if (a < 0 || b >= t.length) return NaN;
        return t[a] + (t[b] - t[a]) * (i - a) / (b - a);
      });
      items.forEach(function (li, i) {
        if (now >= t[i]) li.classList.add('timeline__item--passed');
        if (i + 1 < items.length) {
          var f = (now - t[i]) / (t[i + 1] - t[i]);
          f = isNaN(f) ? 0 : Math.max(0, Math.min(1, f));
          li.style.setProperty('--fill', (f * 100) + '%');
        }
      });
    })();
  </script>
</body>
</html>
